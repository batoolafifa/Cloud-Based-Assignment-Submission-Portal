
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Static Website
        run: |
          mkdir -p public
          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Assignment Submission Portal</title>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
              body {
                font-family: Arial, sans-serif;
                text-align: center;
                padding: 60px 20px;
                background: #f2f5fa;
              }
              .box {
                background: white;
                padding: 35px;
                border-radius: 12px;
                max-width: 600px;
                margin: auto;
              }
            </style>
          </head>
          <body>
            <div class="box">
              <h1>Assignment Submission Portal</h1>
              <p>Welcome to our Cloud-Based Assignment Submission Portal.</p>
              <p>GitHub Pages deployment successful!</p>
              <p>The Flask application runs separately from this static demo page.</p>
            </div>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
